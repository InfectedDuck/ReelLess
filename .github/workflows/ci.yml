name: Release checks

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm test
      - run: npm run validate
      - run: npm run smoke
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: reelless-extension
          path: dist/reels-blocker.zip
          if-no-files-found: error
